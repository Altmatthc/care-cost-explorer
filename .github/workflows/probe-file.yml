name: Probe a price file

# Diagnostic helper. Inspects ONE hospital's price file and prints its column
# structure and sample rows, without downloading the whole thing.
#
# Use this when a hospital reports "0 matching rows" — it finishes in under a
# minute instead of waiting through a full pipeline run.

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Direct URL to the hospital's price file"
        required: true
        default: "https://apps.scripps.org/pricetransparency/951684089_Scripps-Green-Hospital_standardcharges.csv"
      rows:
        description: "How many sample rows to print"
        required: false
        default: "30"
      code:
        description: "Optional: a billing code (e.g. 44970). Shows the raw rows for just that code."
        required: false
        default: ""

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests ijson
      # Inputs via env, never interpolated into the shell.
      - name: Inspect file
        env:
          URL: ${{ github.event.inputs.url }}
          CODE: ${{ github.event.inputs.code }}
        run: |
          set -euo pipefail
          case "$URL" in
            https://*) ;;
            *) echo "URL must start with https://" >&2; exit 1 ;;
          esac
          if [ -n "${CODE:-}" ]; then
            python scripts/build_data.py --stage verify --url "$URL" --code "$CODE"
          else
            python scripts/build_data.py --stage probe --url "$URL"
          fi
